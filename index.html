<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transaksi — My Life</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink:    #0d0d0f;
    --paper:  #f5f2ec;
    --cream:  #ede9e0;
    --gold:   #c9a84c;
    --gold2:  #f0d080;
    --red:    #c0392b;
    --green:  #27ae60;
    --muted:  #888070;
    --border: #d8d2c4;
    --card:   #faf8f4;
    --shadow: 0 2px 24px rgba(0,0,0,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    border-bottom: 3px solid var(--gold);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    letter-spacing: 0.01em;
  }
  header h1 span { color: var(--gold); font-style: italic; }
  .header-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── MAIN ── */
  main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  /* ── SUMMARY CARDS ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow);
    transition: transform .2s;
  }
  .summary-card:hover { transform: translateY(-2px); }
  .summary-card .label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .4rem;
  }
  .summary-card .value {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    letter-spacing: -0.01em;
  }
  .summary-card.total .value { color: var(--gold); }
  .summary-card.count .value { color: var(--ink); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    gap: .75rem;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: .6rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: 'Sora', sans-serif;
    font-size: .85rem;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  .toolbar input[type="text"]:focus { border-color: var(--gold); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .6rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-family: 'Sora', sans-serif;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: #2c2c30; }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-gold:hover { background: var(--gold2); }
  .btn-danger { background: #fce8e6; color: var(--red); border: 1px solid #f5c5c0; }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-edit { background: #eaf3fc; color: #2471a3; border: 1px solid #aed6f1; }
  .btn-edit:hover { background: #2471a3; color: #fff; }
  .btn-sm { padding: .35rem .75rem; font-size: .75rem; border-radius: 6px; }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr {
    background: var(--ink);
    color: var(--paper);
  }
  thead th {
    padding: .85rem 1rem;
    text-align: left;
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--cream); }
  tbody td {
    padding: .9rem 1rem;
    font-size: .83rem;
    vertical-align: middle;
  }
  .td-id {
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    color: var(--muted);
  }
  .td-amount {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: .88rem;
  }
  .td-amount.pos { color: var(--green); }
  .td-amount.neg { color: var(--red); }
  .td-date {
    font-family: 'DM Mono', monospace;
    font-size: .72rem;
    color: var(--muted);
  }
  .td-foto img {
    width: 42px; height: 42px;
    border-radius: 8px;
    object-fit: cover;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: transform .2s;
  }
  .td-foto img:hover { transform: scale(1.1); }
  .no-foto {
    width: 42px; height: 42px;
    background: var(--cream);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .65rem;
    color: var(--muted);
    border: 1.5px dashed var(--border);
  }
  .actions { display: flex; gap: .4rem; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty .icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }
  .empty p { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }

  /* ── MODAL ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(13,13,15,.55);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 2rem 2.25rem;
    width: min(520px, 94vw);
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 16px 64px rgba(0,0,0,.22);
    animation: popIn .22s ease;
  }
  @keyframes popIn {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    margin-bottom: 1.5rem;
    padding-bottom: .75rem;
    border-bottom: 2px solid var(--gold);
  }
  .form-row { margin-bottom: 1.1rem; }
  .form-row label {
    display: block;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .35rem;
  }
  .form-row input,
  .form-row textarea {
    width: 100%;
    padding: .65rem .9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--paper);
    font-family: 'Sora', sans-serif;
    font-size: .85rem;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
    resize: vertical;
  }
  .form-row input:focus,
  .form-row textarea:focus { border-color: var(--gold); }
  .foto-preview {
    margin-top: .5rem;
    width: 80px; height: 80px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid var(--border);
    display: none;
  }
  .modal-footer {
    display: flex;
    gap: .75rem;
    justify-content: flex-end;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .btn-cancel {
    background: var(--cream);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-cancel:hover { background: var(--border); color: var(--ink); }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 2rem; right: 2rem;
    background: var(--ink);
    color: var(--paper);
    padding: .8rem 1.4rem;
    border-radius: 10px;
    font-size: .82rem;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
    transform: translateY(120%);
    opacity: 0;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999;
    border-left: 4px solid var(--gold);
    max-width: 320px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.error { border-left-color: var(--red); }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 300;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }

  @media (max-width: 700px) {
    .summary { grid-template-columns: 1fr 1fr; }
    header { padding: 0 1rem; }
    thead th:nth-child(3), tbody td:nth-child(3) { display: none; } /* hide description */
    main { padding: 1.5rem .75rem 3rem; }
  }
</style>
</head>
<body>

<header>
  <h1>My <span>Life</span> — Transaksi</h1>
  <span class="header-meta">Financial Ledger</span>
</header>

<main>
  <!-- Summary -->
  <div class="summary">
    <div class="summary-card total">
      <div class="label">Total Saldo</div>
      <div class="value" id="totalAmount">Rp 0</div>
    </div>
    <div class="summary-card count">
      <div class="label">Jumlah Transaksi</div>
      <div class="value" id="totalCount">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Transaksi Terbaru</div>
      <div class="value" id="latestDate" style="font-size:1.1rem;color:var(--muted)">—</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍  Cari nama atau deskripsi..." oninput="filterTable()"/>
    <button class="btn btn-gold" onclick="openModal()">＋ Tambah Transaksi</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Deskripsi</th>
          <th>Jumlah</th>
          <th>Tanggal</th>
          <th>Foto</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7"><div class="empty"><div class="icon">📋</div><p>Memuat data…</p></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Modal Form -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Tambah Transaksi</h2>
    <input type="hidden" id="editId"/>

    <div class="form-row">
      <label>Nama *</label>
      <input type="text" id="fName" placeholder="Contoh: Gaji, Makan Siang…"/>
    </div>
    <div class="form-row">
      <label>Deskripsi</label>
      <textarea id="fDesc" rows="2" placeholder="Keterangan tambahan (opsional)"></textarea>
    </div>
    <div class="form-row">
      <label>Jumlah (Rp) *</label>
      <input type="number" id="fAmount" placeholder="Masukkan nominal, minus untuk pengeluaran"/>
    </div>
    <div class="form-row">
      <label>Tanggal *</label>
      <input type="date" id="fDate"/>
    </div>
    <div class="form-row">
      <label>Foto Bukti</label>
      <input type="file" id="fFoto" accept="image/*" onchange="previewFoto(this)"/>
      <img id="fotoPreview" class="foto-preview" alt="Preview"/>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveTransaksi()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightboxImg" src="" alt="Foto transaksi"/>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const API = "http://localhost:3000/api/transaksi";
let allData = [];

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(API);
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    allData = json.data;
    renderTable(allData);
    updateSummary(allData);
  } catch (e) {
    renderError(e.message);
  }
}

function updateSummary(data) {
  const total = data.reduce((s, r) => s + parseFloat(r.amount || 0), 0);
  document.getElementById("totalAmount").textContent = formatRp(total);
  document.getElementById("totalCount").textContent = data.length;
  if (data.length > 0) {
    const d = new Date(data[0].date);
    document.getElementById("latestDate").textContent =
      d.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
  } else {
    document.getElementById("latestDate").textContent = "—";
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="icon">📭</div><p>Belum ada transaksi</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map((r, i) => `
    <tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td style="color:var(--muted);font-size:.8rem">${esc(r.description || '—')}</td>
      <td class="td-amount ${parseFloat(r.amount) >= 0 ? 'pos' : 'neg'}">${formatRp(r.amount)}</td>
      <td class="td-date">${formatDate(r.date)}</td>
      <td class="td-foto">${r.foto
        ? `<img src="http://localhost:3000/uploads/${r.foto}" alt="foto"
              onclick="openLightbox(this.src)" title="Klik untuk perbesar"/>`
        : `<div class="no-foto">—</div>`}</td>
      <td class="actions">
        <button class="btn btn-edit btn-sm" onclick="openEdit(${r.id})">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTransaksi(${r.id}, '${esc(r.name)}')">🗑</button>
      </td>
    </tr>
  `).join("");
}

function renderError(msg) {
  document.getElementById("tableBody").innerHTML =
    `<tr><td colspan="7"><div class="empty"><div class="icon">⚠️</div>
      <p style="color:var(--red)">${msg}</p>
      <p style="margin-top:.5rem;font-size:.8rem">Pastikan server berjalan di localhost:3000</p>
    </div></td></tr>`;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function filterTable() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const filtered = allData.filter(r =>
    (r.name || "").toLowerCase().includes(q) ||
    (r.description || "").toLowerCase().includes(q)
  );
  renderTable(filtered);
  updateSummary(filtered);
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById("modalTitle").textContent = "Tambah Transaksi";
  document.getElementById("editId").value = "";
  document.getElementById("fName").value = "";
  document.getElementById("fDesc").value = "";
  document.getElementById("fAmount").value = "";
  document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("fFoto").value = "";
  document.getElementById("fotoPreview").style.display = "none";
  document.getElementById("overlay").classList.add("active");
}

async function openEdit(id) {
  try {
    const res = await fetch(`${API}/${id}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    const r = json.data;
    document.getElementById("modalTitle").textContent = "Edit Transaksi";
    document.getElementById("editId").value = r.id;
    document.getElementById("fName").value = r.name || "";
    document.getElementById("fDesc").value = r.description || "";
    document.getElementById("fAmount").value = r.amount || "";
    document.getElementById("fDate").value = r.date ? r.date.slice(0,10) : "";
    document.getElementById("fFoto").value = "";
    const prev = document.getElementById("fotoPreview");
    if (r.foto) {
      prev.src = `http://localhost:3000/uploads/${r.foto}`;
      prev.style.display = "block";
    } else {
      prev.style.display = "none";
    }
    document.getElementById("overlay").classList.add("active");
  } catch (e) { toast("Gagal memuat data: " + e.message, true); }
}

function closeModal() {
  document.getElementById("overlay").classList.remove("active");
}
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("overlay")) closeModal();
});

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveTransaksi() {
  const id     = document.getElementById("editId").value;
  const name   = document.getElementById("fName").value.trim();
  const desc   = document.getElementById("fDesc").value.trim();
  const amount = document.getElementById("fAmount").value;
  const date   = document.getElementById("fDate").value;
  const foto   = document.getElementById("fFoto").files[0];

  if (!name || !amount || !date) {
    toast("Name, jumlah, dan tanggal wajib diisi!", true); return;
  }

  const fd = new FormData();
  fd.append("name", name);
  fd.append("description", desc);
  fd.append("amount", amount);
  fd.append("date", date);
  if (foto) fd.append("foto", foto);

  try {
    const url    = id ? `${API}/${id}` : API;
    const method = id ? "PUT" : "POST";
    const res    = await fetch(url, { method, body: fd });
    const json   = await res.json();
    if (!json.success) throw new Error(json.message);
    toast(id ? "Transaksi berhasil diperbarui ✓" : "Transaksi berhasil ditambahkan ✓");
    closeModal();
    loadData();
  } catch (e) { toast("Gagal menyimpan: " + e.message, true); }
}

// ── DELETE ────────────────────────────────────────────────────────────────────
async function deleteTransaksi(id, name) {
  if (!confirm(`Hapus transaksi "${name}"?`)) return;
  try {
    const res  = await fetch(`${API}/${id}`, { method: "DELETE" });
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    toast("Transaksi dihapus ✓");
    loadData();
  } catch (e) { toast("Gagal menghapus: " + e.message, true); }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function previewFoto(input) {
  const prev = document.getElementById("fotoPreview");
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { prev.src = e.target.result; prev.style.display = "block"; };
    reader.readAsDataURL(input.files[0]);
  }
}
function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("active");
}
function formatRp(n) {
  const num = parseFloat(n) || 0;
  return (num < 0 ? "−" : "") + "Rp " +
    Math.abs(num).toLocaleString("id-ID", { minimumFractionDigits: 0 });
}
function formatDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
}
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
